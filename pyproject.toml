[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "domhunt"
version = "0.1.0"
description = "Local CLI for finding unregistered .com domains with RDAP and brandable generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Your Name"}
]

[project.scripts]
domhunt = "domhunt:main"
